<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f472b6;
      --accent-soft: rgba(244, 114, 182, 0.16);
      --card: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 45%);
      color: var(--text);
      line-height: 1.45;
      text-wrap: pretty;
      overflow-wrap: anywhere;
    }

    .container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    h1 { margin: 0 0 8px; font-size: 2rem; text-wrap: balance; }
    .subtitle { color: var(--muted); max-width: 780px; margin-bottom: 28px; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .meta span {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .timeline {
      position: relative;
      margin-left: 14px;
      padding-left: 22px;
      border-left: 2px solid var(--line);
    }

    .stage {
      position: relative;
      margin-bottom: 22px;
      padding: 16px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, var(--card), #172033);
    }

    .stage::before {
      content: "";
      position: absolute;
      left: -31px;
      top: 20px;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .stage h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .goal { color: var(--muted); margin: 0 0 10px; font-size: 0.95rem; }

    ul { margin: 0; padding-left: 18px; }
    li { margin-bottom: 7px; color: #cbd5e1; }

    h2,
    p,
    li,
    a,
    .meta span,
    .footer-tip {
      text-wrap: pretty;
      overflow-wrap: anywhere;
    }
    
    a {
      color: #f9a8d4;
      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-style: dashed;
    }

    .footer-tip {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.93rem;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .stat {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin: 0 6px;
      font-size: 0.98em;
    }

    @media (max-width: 700px) {
      h1 { font-size: 1.6rem; }
      .timeline { margin-left: 8px; padding-left: 16px; }
      .stage::before { left: -25px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="page-title"></h1>
    <p class="subtitle" id="page-subtitle"></p>
    <section class="timeline" id="timeline" aria-live="polite"></section>
    <div class="footer-tip" id="footer-tip"></div>
  </main>

  <script>
    const creditsPerMonth = 5;

    function formatMonths(credits) {
      return Math.max(1, Math.ceil(credits / creditsPerMonth));
    }

    function createCourseItem(course) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = course.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = course.title;

      item.append(link, document.createTextNode(` (${course.credits} cr)`));
      return item;
    }

    function createStage(stage, index) {
      const article = document.createElement('article');
      article.className = 'stage';

      const heading = document.createElement('h2');
      heading.textContent = `${index + 1}) ${stage.title}`;

      const goal = document.createElement('p');
      goal.className = 'goal';
      goal.textContent = `Goal: ${stage.goal}`;

      const list = document.createElement('ul');
      stage.courses.forEach((course) => {
        list.appendChild(createCourseItem(course));
      });

      article.append(heading, goal, list);
      return article;
    }

    async function loadRoadmap() {
      const response = await fetch('designer-roadmap.json');
      if (!response.ok) {
        throw new Error(`Failed to load roadmap data: ${response.status}`);
      }

      return response.json();
    }

    function renderRoadmap(data) {
      const title = document.getElementById('page-title');
      const subtitle = document.getElementById('page-subtitle');
      const timeline = document.getElementById('timeline');
      const footerTip = document.getElementById('footer-tip');

      const totalCourses = data.stages.reduce((sum, stage) => sum + stage.courses.length, 0);
      const totalCredits = data.stages.reduce(
        (sum, stage) => sum + stage.courses.reduce((stageSum, course) => stageSum + course.credits, 0),
        0,
      );
      const estimatedMonths = formatMonths(totalCredits);

      document.title = data.pageTitle;
      title.textContent = data.pageTitle;
      subtitle.innerHTML = data.subtitle
        .replace('{profession}', data.profession)
        .replace('{courseCount}', `<span class="stat">${totalCourses}</span>`)
        .replace('{creditCount}', `<span class="stat">${totalCredits}</span>`)
        .replace('{months}', `<span class="stat">${estimatedMonths}</span>`);

      timeline.replaceChildren(...data.stages.map(createStage));
      footerTip.textContent = data.footerTip.replace('{creditsPerMonth}', creditsPerMonth);
    }

    loadRoadmap()
      .then(renderRoadmap)
      .catch((error) => {
        const subtitle = document.getElementById('page-subtitle');
        subtitle.textContent = `Unable to load roadmap data. ${error.message}`;
      });
  </script>
</body>
</html>

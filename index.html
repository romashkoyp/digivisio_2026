<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f472b6;
      --accent-soft: rgba(244, 114, 182, 0.16);
      --card: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 45%);
      color: var(--text);
      line-height: 1.45;
      text-wrap: pretty;
      overflow-wrap: anywhere;
    }

    .container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    h1 { margin: 0 0 8px; font-size: 2rem; text-wrap: balance; }
    .subtitle { color: var(--muted); max-width: 780px; margin-bottom: 28px; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .meta span {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .timeline {
      position: relative;
      margin-left: 14px;
      padding-left: 22px;
      border-left: 2px solid var(--line);
    }

    .stage {
      position: relative;
      margin-bottom: 22px;
      padding: 16px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, var(--card), #172033);
    }

    .stage::before {
      content: "";
      position: absolute;
      left: -31px;
      top: 20px;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .stage h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .goal { color: var(--muted); margin: 0 0 10px; font-size: 0.95rem; }

    ul { margin: 0; padding-left: 18px; }
    li { margin-bottom: 7px; color: #cbd5e1; }

    h2,
    p,
    li,
    a,
    .meta span,
    .footer-tip {
      text-wrap: pretty;
      overflow-wrap: anywhere;
    }
    
    a {
      color: #f9a8d4;
      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-style: dashed;
    }

    .footer-tip {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.93rem;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .stat {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin: 0 6px;
      font-size: 0.98em;
    }

    @media (max-width: 700px) {
      h1 { font-size: 1.6rem; }
      .timeline { margin-left: 8px; padding-left: 16px; }
      .stage::before { left: -25px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div style="text-align: center; margin-bottom: 40px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <rect x="18" y="10" width="4" height="4" rx="1"></rect>
        <rect x="2" y="10" width="4" height="4" rx="1"></rect>
        <rect x="10" y="18" width="4" height="4" rx="1"></rect>
        <rect x="10" y="2" width="4" height="4" rx="1"></rect>
        <path d="M16 12h2"></path>
        <path d="M6 12h2"></path>
        <path d="M12 16v2"></path>
        <path d="M12 6v2"></path>
        <circle cx="18" cy="6" r="2"></circle>
        <circle cx="6" cy="6" r="2"></circle>
        <circle cx="18" cy="18" r="2"></circle>
        <circle cx="6" cy="18" r="2"></circle>
        <path d="M16.5 7.5L14.8 9.2"></path>
        <path d="M7.5 7.5L9.2 9.2"></path>
        <path d="M16.5 16.5L14.8 14.8"></path>
        <path d="M7.5 16.5L9.2 14.8"></path>
      </svg>
      <h1 style="font-size: 2.5rem; margin-top: 10px;">Skill Matching Machine</h1>
    </div>

    <div style="margin-bottom: 30px; display: flex; flex-direction: column; gap: 8px;">
      <label for="profession-select" style="font-weight: bold; font-size: 1.1rem;">Choose a profession and AI will match the most valuable skills with 5000 open higher education courses from <a href="https://opin.fi/en/search" target="_blank" rel="noopener noreferrer">opin.fi</a>:</label>
      <select id="profession-select" style="padding: 10px; border-radius: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--line); font-size: 1rem; max-width: 300px;">
        <option value="">-- Loading... --</option>
      </select>
    </div>

    <h2 id="page-title"></h2>
    <p class="subtitle" id="page-subtitle"></p>
    <p id="voucher-info" style="display: none; margin-top: -15px; margin-bottom: 25px; color: var(--muted);">
      You can apply for a voucher up to 30 credits. See more information <a href="https://opin.fi/en/opintoseteli" target="_blank" rel="noopener noreferrer">here</a>.
    </p>
    <section class="timeline" id="timeline" aria-live="polite"></section>
    <div class="footer-tip" id="footer-tip" style="display: none;"></div>
  </main>

  <script>
    const creditsPerMonth = 5;
    let roadmapsData = {};

    function formatMonths(credits) {
      return Math.max(1, Math.ceil(credits / creditsPerMonth));
    }

    function createCourseItem(course) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = course.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = course.title;

      item.append(link, document.createTextNode(` (${course.credits} cr)`));
      return item;
    }

    function createStage(stage, index) {
      const article = document.createElement('article');
      article.className = 'stage';

      const heading = document.createElement('h2');
      heading.textContent = `${index + 1}) ${stage.title}`;

      const goal = document.createElement('p');
      goal.className = 'goal';
      goal.textContent = `Goal: ${stage.goal}`;

      const list = document.createElement('ul');
      stage.courses.forEach((course) => {
        list.appendChild(createCourseItem(course));
      });

      article.append(heading, goal, list);
      return article;
    }

    async function init() {
      try {
        const response = await fetch('roadmaps.json');
        if (!response.ok) {
          throw new Error(`Failed to load roadmaps data: ${response.status}`);
        }
        roadmapsData = await response.json();
        
        // Define the list of "hot" profession keys
        const hotProfessions = [
          'hr_specialist',
          'financial_specialist',
          'ai_digital_marketing_strategist',
          'psychology_wellbeing_social_care'
        ];
        
        const select = document.getElementById('profession-select');
        select.innerHTML = '<option value="">-- Select --</option>';
        
        for (const key of Object.keys(roadmapsData)) {
          const option = document.createElement('option');
          const profession = roadmapsData[key].profession;
          option.value = key;
          
          // Capitalize each word for the display text
          let optionText = profession.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
          
          // Append the special mark if the key is in our hot list
          if (hotProfessions.includes(key)) {
            optionText += ' 🔥'; 
          }
          
          option.textContent = optionText;
          select.appendChild(option);
        }
      } catch (error) {
        document.getElementById('page-subtitle').textContent = `Unable to load data. ${error.message}`;
      }
    }

    function renderRoadmap(data) {
      const title = document.getElementById('page-title');
      const subtitle = document.getElementById('page-subtitle');
      const timeline = document.getElementById('timeline');
      const footerTip = document.getElementById('footer-tip');

      const totalCourses = data.stages.reduce((sum, stage) => sum + stage.courses.length, 0);
      const totalCredits = data.stages.reduce(
        (sum, stage) => sum + stage.courses.reduce((stageSum, course) => stageSum + course.credits, 0),
        0,
      );
      const estimatedMonths = formatMonths(totalCredits);

      document.title = data.pageTitle;
      title.textContent = data.pageTitle;
      subtitle.innerHTML = data.subtitle
        .replace('{profession}', data.profession)
        .replace('{courseCount}', `<span class="stat">${totalCourses}</span>`)
        .replace('{creditCount}', `<span class="stat">${totalCredits}</span>`)
        .replace('{months}', `<span class="stat">${estimatedMonths}</span>`);

      timeline.replaceChildren(...data.stages.map(createStage));
      footerTip.style.display = 'block';
      document.getElementById('voucher-info').style.display = 'block'; // <-- Add this line
      footerTip.textContent = data.footerTip.replace('{creditsPerMonth}', creditsPerMonth);
    }

    document.getElementById('profession-select').addEventListener('change', (e) => {
      const selectedValue = e.target.value;
      const title = document.getElementById('page-title');
      const subtitle = document.getElementById('page-subtitle');
      const timeline = document.getElementById('timeline');
      const footerTip = document.getElementById('footer-tip');

      if (!selectedValue || !roadmapsData[selectedValue]) {
        title.textContent = '';
        subtitle.textContent = selectedValue ? `No data available for ${selectedValue}.` : '';
        timeline.replaceChildren();
        footerTip.style.display = 'none';
        document.getElementById('voucher-info').style.display = 'none'; // <-- Add this line
        return;
      }

      renderRoadmap(roadmapsData[selectedValue]);
    });

    init();
  </script>
</body>
</html>
